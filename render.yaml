# ── Render Blueprint ──────────────────────────────────────
# Статичний сайт: бекенда немає, усе рахується в браузері. Render збирає
# проєкт і роздає готовий dist/ зі свого CDN — на відміну від web-сервісу на
# безкоштовному плані, статика не засинає, тож посилання відкривається одразу
# навіть якщо ним не користувалися тиждень.

services:
  - type: web
    name: tramline-calc
    runtime: static
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist

    headers:
      # Хеш у назві файлу змінюється з кожною збіркою, тож ассети можна
      # кешувати назавжди, а саму сторінку — ні, інакше люди місяцями
      # сидітимуть на старій версії.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /index.html
        name: Cache-Control
        value: no-cache
