# ── Render Blueprint ──────────────────────────────────────
# Раніше це була статика. З появою акаунтів потрібен процес, який тримає
# сесії й ходить у базу, тож сервіс став вебсервісом: той самий Express
# віддає і API, і зібраний фронтенд — окремий статичний сервіс дав би лише
# другий деплой і зайвий домен.
#
# Ціна цієї зміни: безкоштовний вебсервіс на Render засинає після ~15 хвилин
# без запитів і прокидається пів хвилини. Для калькулятора, який відкривають
# раз на день, це помітно — але без бекенда акаунтів не буває.
#
# База — Neon (той самий підхід, що й у Lytware). DATABASE_URL задається в
# дашборді Render і в git не потрапляє.

services:
  - type: web
    name: tramline-calc
    runtime: node
    plan: free
    branch: main
    # Явно, хоч це і є типовим значенням: коли автодеплой мовчить, перше, що
    # перевіряють, — чи він узагалі ввімкнений, і відповідь має бути в репозиторії.
    autoDeploy: true
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_VERSION
        value: 20
