<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 38 38">
  <!-- Поле в розрізі: щільні рядки сходів, а посередині колія — порожня
       смуга, у якій лежать два сліди коліс. Той самий знак, що й у самій
       системі; кольори тут статичні, бо вкладку браузера темою програми не
       перефарбуєш. -->
  <rect width="38" height="38" rx="9" fill="#18242d"/>
  <g fill="#8fb6d0">
    <rect x="2.5"  y="6" width="2.4" height="26" rx="1.2"/>
    <rect x="7"    y="6" width="2.4" height="26" rx="1.2"/>
    <rect x="11.5" y="6" width="2.4" height="26" rx="1.2"/>
    <rect x="26.5" y="6" width="2.4" height="26" rx="1.2"/>
    <rect x="31"   y="6" width="2.4" height="26" rx="1.2"/>
    <rect x="35.5" y="6" width="2.4" height="26" rx="1.2"/>
  </g>
  <g fill="#e08a6f">
    <rect x="16.4" y="4" width="2" height="30" rx="1"/>
    <rect x="21.4" y="4" width="2" height="30" rx="1"/>
  </g>
</svg>
